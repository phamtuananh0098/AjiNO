<!doctype html>
<html lang="vi" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Duyên Ca · Wedding Playlist Studio</title>
    <meta
      name="description"
      content="Duyên Ca — Studio nhạc cưới tự do cá nhân hoá: phân chia giai đoạn đám cưới, ghi chú khoảnh khắc, cắt đoạn nhạc chuẩn xác, hỗ trợ tải nhạc từ máy tính, điện thoại, Google Drive và đồng bộ tức thì trên mọi thiết bị."
    />
    <meta name="theme-color" content="#f6f0e5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Duyên Ca" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var theme = 'paper';
        try {
          var raw = localStorage.getItem('duyen-ca-ajino:v1');
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.preferences && parsed.preferences.theme) {
              theme = parsed.preferences.theme;
            }
          }
        } catch (e) {
          theme = 'paper';
        }
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          var colors = {
            paper: '#f6f0e5',
            night: '#17100f',
            champagne: '#fbf7ee',
            rose: '#fdf3f4'
          };
          meta.setAttribute('content', colors[theme] || '#f6f0e5');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
